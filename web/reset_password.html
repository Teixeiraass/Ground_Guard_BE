<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Ground Guard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{{if .SiteKey}}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{end}}
<style>
  :root {
    --primary: #173518;
    --primary-container: #2D4C2D;
    --background: #FAFAF4;
    --surface-container: #EEEEE9;
    --on-background: #1A1C19;
    --outline: #737970;
    --error: #BA1A1A;
    --success: #4CAF50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    font-family: 'Inter', -apple-system, Helvetica, Arial, sans-serif;
    color: var(--on-background);
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(23, 53, 24, 0.12);
    overflow: hidden;
  }
  .card-header {
    background: var(--primary);
    padding: 28px 32px;
  }
  .card-header h1 {
    color: #FFFFFF;
    font-size: 20px;
    margin: 0;
  }
  .card-body { padding: 32px; }
  .card-body p.hint {
    color: var(--outline);
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--outline);
    background: var(--surface-container);
    font-size: 15px;
    font-family: inherit;
    color: var(--on-background);
  }
  input[type="password"]:focus {
    outline: 2px solid var(--primary-container);
    outline-offset: 1px;
  }
  .turnstile-wrap { margin-top: 20px; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    margin-top: 16px;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    display: none;
  }
  .message.error { display: block; background: #FBE9E7; color: var(--error); }
  .message.success { display: block; background: #E8F5E9; color: var(--success); }
  .success-view { display: none; text-align: center; }
  .success-view .icon { font-size: 40px; }
  .success-view h2 { color: var(--primary); margin: 12px 0 8px; }
  .success-view p { color: var(--outline); font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Ground Guard</h1>
    </div>
    <div class="card-body">
      <div id="form-view">
        <p class="hint">Escolha uma nova senha para sua conta.</p>
        <form id="reset-form">
          <label for="password">Nova senha</label>
          <input type="password" id="password" minlength="6" required autocomplete="new-password">

          <label for="confirm-password">Confirmar nova senha</label>
          <input type="password" id="confirm-password" minlength="6" required autocomplete="new-password">

          {{if .SiteKey}}
          <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="{{.SiteKey}}"></div>
          </div>
          {{end}}

          <button type="submit" id="submit-btn">Redefinir senha</button>
          <div class="message error" id="error-message"></div>
        </form>
      </div>

      <div class="success-view" id="success-view">
        <div class="icon">✅</div>
        <h2>Senha redefinida</h2>
        <p>Você já pode voltar para o app e entrar com sua nova senha.</p>
      </div>
    </div>
  </div>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get('token');
  var form = document.getElementById('reset-form');
  var errorMessage = document.getElementById('error-message');
  var submitBtn = document.getElementById('submit-btn');

  if (!token) {
    errorMessage.textContent = 'Link inválido ou incompleto. Solicite um novo email de redefinição de senha pelo app.';
    errorMessage.classList.add('error');
    submitBtn.disabled = true;
    return;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    errorMessage.classList.remove('error');
    errorMessage.textContent = '';

    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirm-password').value;

    if (password.length < 6) {
      errorMessage.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      errorMessage.classList.add('error');
      return;
    }

    if (password !== confirmPassword) {
      errorMessage.textContent = 'As senhas não coincidem.';
      errorMessage.classList.add('error');
      return;
    }

    var turnstileToken = '';
    if (window.turnstile) {
      turnstileToken = window.turnstile.getResponse();
      if (!turnstileToken) {
        errorMessage.textContent = 'Confirme que você não é um robô.';
        errorMessage.classList.add('error');
        return;
      }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Redefinindo...';

    fetch('/api/v1/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        new_password: password,
        turnstile_token: turnstileToken
      })
    }).then(function (response) {
      if (response.status === 204 || response.ok) {
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
        return;
      }
      return response.json().catch(function () { return {}; }).then(function (body) {
        throw new Error(body.error || 'Não foi possível redefinir a senha. O link pode ter expirado.');
      });
    }).catch(function (err) {
      errorMessage.textContent = err.message;
      errorMessage.classList.add('error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Redefinir senha';
      if (window.turnstile) window.turnstile.reset();
    });
  });
})();
</script>
</body>
</html>
