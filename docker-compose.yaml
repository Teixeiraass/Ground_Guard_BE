version: "3.9"
services:
    postgres:
        image: postgres:16.13-alpine
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=ground_guard
    mosquitto:
        image: eclipse-mosquitto:2
        ports:
            - "1883:1883"
        volumes:
            - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
    api:
        build:
            context: .
            dockerfile: Dockerfile
        ports: 
            - "8081:8080"
        environment:
            - DB_SOURCE=postgresql://root:secret@postgres:5432/ground_guard?sslmode=disable
            - MQTT_ENABLED=true
            - MQTT_BROKER_URL=tcp://mosquitto:1883
            - MQTT_CLIENT_ID=ground-guard-api
            - MQTT_TOPIC_PREFIX=ground-guard
        depends_on:
            - postgres
            - mosquitto
        entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh"]
        command: [ "/app/main" ]

