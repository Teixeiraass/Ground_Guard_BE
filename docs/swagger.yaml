        "400":
          description: Token inválido, expirado ou payload inválido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno no servidor
          schema:
            additionalProperties: true
            type: object
      summary: Confirma o email do usuário
      tags:
      - users
  /users/verify-email/resend:
