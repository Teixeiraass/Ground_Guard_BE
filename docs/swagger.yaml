basePath: /
definitions:
  dto.CreateDeviceRequest:
    properties:
      device_uid:
        type: string
      firmware_build:
        type: string
      firmware_version:
        type: string
      ip_address:
        type: string
      name:
        type: string
      status:
        enum:
        - ATIVO
        - INATIVO
        type: string
      wifi_ssid:
        type: string
    required:
    - device_uid
    - name
    - status
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  dto.DeviceResponse:
    properties:
      device_uid:
        type: string
      firmware_build:
        type: string
      firmware_version:
        type: string
      ip_address:
        type: string
      last_seen:
        type: string
      last_update:
        type: string
      name:
        type: string
      status:
        type: string
      user:
        type: integer
      uuid:
        type: string
      wifi_ssid:
        type: string
    type: object
  dto.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginUserResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RenewAccessTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RenewAccessTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      password_changed_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API do projeto ground guard automação de jardim
  title: Ground Guard API
  version: "1.0"
paths:
  /devices:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de todos os dispositivos associados
        ao usuário autenticado.
      parameters:
      - description: Número da página (mínimo 1)
        in: query
        name: page_id
        required: true
        type: integer
      - description: Quantidade de itens por página (5 a 10)
        in: query
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DeviceResponse'
            type: array
        "400":
          description: Bad Request (Parâmetros de paginação inválidos)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar dispositivos do usuário
      tags:
      - devices
    post:
      consumes:
      - application/json
      description: Registra um novo dispositivo no sistema e gera seu QR Code de pareamento.
      parameters:
      - description: Dados do dispositivo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden (Unique Violation)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cadastrar novo dispositivo
      tags:
      - devices
  /devices/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna as informações de um dispositivo específico cadastrado
        pelo UUID, garantindo que pertença ao usuário autenticado.
      parameters:
      - description: UUID do Dispositivo
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (UUID inválido)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Não pertence ao usuário)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obter detalhes de um dispositivo
      tags:
      - devices
  /tokens/refresh:
    post:
      consumes:
      - application/json
      description: Gera um novo token de acesso usando um refresh token válido
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RenewAccessTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RenewAccessTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Token inválido ou expirado)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Renovar token de acesso
      tags:
      - auth
  /users:
    post:
      consumes:
      - application/json
      description: Registra um novo usuário no aplicativo ground guard
      parameters:
      - description: Dados de criação do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden (e.g., e-mail ou username já existe)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Criar um novo usuário
      tags:
      - users
  /users/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário e retorna os tokens de acesso e refresh
      parameters:
      - description: Credenciais de login (email e senha)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginUserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Senha incorreta)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User Not Found (Email não registrado)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login de usuário
      tags:
      - auth
  /users/me:
    get:
      consumes:
      - application/json
      description: Retorna as informações do usuário autenticado a partir do token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "404":
          description: User Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obter perfil do usuário logado
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your PASETO token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
