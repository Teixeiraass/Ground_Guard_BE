host: api-dev.ground-guard.com.br
info:
  contact:
    email: contato@groundguard.com
    name: Guilherme Teixeira
  description: |-
    API REST do Ground Guard, uma plataforma IoT para monitoramento, automação e operação de jardins e plantas.
    O backend centraliza autenticação, vínculo de dispositivos, preferências e histórico de irrigação, comandos remotos, telemetria, conteúdos de suporte e relatórios operacionais.
    O projeto foi estruturado como produto comercial: pensado para onboarding rápido de novos desenvolvedores, expansão por módulos e manutenção contínua em ambiente de produção.
  license:
    name: MIT
  termsOfService: https://groundguard.com/terms
  title: Ground Guard API
  version: 1.0.0
paths:
  /admin/firmware:
    get:
      parameters:
      - description: Página (default 1)
        in: query
        name: page_id
        type: integer
      - description: Itens por página (default 20)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.FirmwareReleaseResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Listar versões do firmware (admin)
      tags:
      - admin
    post:
      consumes:
      - multipart/form-data
      description: Envia o firmware.bin da controladora. A versão precisa ser maior
        que a última publicada. Donos de controladoras desatualizadas sem atualização
        automática recebem uma notificação.
      parameters:
      - description: firmware.bin gerado pelo PlatformIO
        in: formData
        name: file
        required: true
        type: file
      - description: 'Versão, ex.: 1.1.0 (igual ao FIRMWARE_VERSION do config.h)'
        in: formData
        name: version
        required: true
        type: string
      - description: 'Build, ex.: 2'
        in: formData
        name: build
        required: true
        type: string
      - description: O que mudou
        in: formData
        name: release_notes
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FirmwareReleaseResponse'
        "400":
          description: Arquivo ou versão inválidos
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Acesso de admin necessário
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Versão não é maior que a última
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Publicar nova versão do firmware (admin)
      tags:
      - admin
  /admin/support/conversations:
    get:
      description: Uma linha por usuário que já escreveu no chat, com a última mensagem
        e quantas mensagens do usuário ainda não foram lidas.
      parameters:
      - description: Página (default 1)
        in: query
        name: page_id
        type: integer
      - description: Itens por página (default 50, máx 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SupportConversationResponse'
            type: array
        "403":
          description: Acesso de admin necessário
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar conversas do suporte (admin)
      tags:
      - admin
  /admin/support/conversations/{uuid}/messages:
    get:
      description: Lista as mensagens do chat do usuário, mais recentes primeiro,
        e marca as mensagens dele como lidas.
      parameters:
      - description: UUID do usuário
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Página (default 1)
        in: query
        name: page_id
        type: integer
      - description: Itens por página (default 50, máx 100)
        in: query
        name: page_size
        type: integer
