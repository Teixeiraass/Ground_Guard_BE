          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request (Arquivo não enviado ou inválido)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
