basePath: /api/v1
definitions:
  dto.CreateDeviceRequest:
    properties:
      device_uid:
        type: string
      firmware_build:
        type: string
      firmware_version:
        type: string
      ip_address:
        type: string
      name:
        type: string
      status:
        enum:
        - ATIVO
        - INATIVO
        type: string
      wifi_ssid:
        type: string
    required:
    - device_uid
    - name
    - status
    type: object
  dto.CreateIrrigationCommandRequest:
    properties:
      action:
        enum:
        - START
        - STOP
        type: string
      device_id:
        type: string
      duration:
        type: integer
    required:
    - action
    - device_id
    type: object
  dto.CreateIrrigationCommandResponse:
    properties:
      command_id:
        type: string
      status:
        type: string
    type: object
  dto.CreateIrrigationPreferenceRequest:
    properties:
      device_uuid:
        type: string
      dry_time_minutes:
        type: integer
      end_hour:
        type: string
      irrigation_mode:
        enum:
        - INTELIGENTE
        - MANUAL
        type: string
      max_irrigation_per_day:
        minimum: 1
        type: integer
      moisture_threshold:
        maximum: 100
        type: integer
      start_hour:
        type: string
    required:
    - device_uuid
    - dry_time_minutes
    - irrigation_mode
    - max_irrigation_per_day
    - moisture_threshold
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  dto.DeviceResponse:
    properties:
      device_uid:
        type: string
      firmware_build:
        type: string
      firmware_version:
        type: string
      ip_address:
        type: string
      last_seen:
        type: string
      last_update:
        type: string
      name:
        type: string
      status:
        type: string
      user:
        type: integer
      uuid:
        type: string
      wifi_ssid:
        type: string
    type: object
  dto.FaqResponse:
    properties:
      answer:
        type: string
      category:
        type: string
      order_number:
        type: integer
      question:
        type: string
      uuid:
        type: string
    type: object
  dto.HelpContentResponse:
    properties:
      category:
        type: string
      content:
        type: string
      image_url:
        type: string
      order_number:
        type: integer
      published:
        type: boolean
      slug:
        type: string
      title:
        type: string
      uuid:
        type: string
    type: object
  dto.IrrigationPreferenceResponse:
    properties:
      device_id:
        type: integer
      dry_time_minutes:
        type: integer
      enabled:
        type: boolean
      end_hour:
        type: string
      irrigation_duration_seconds:
        type: integer
      irrigation_mode:
        type: string
      max_irrigations_per_day:
        type: integer
      moisture_threshold:
        type: integer
      start_hour:
        type: string
      uuid:
        type: string
    type: object
  dto.LegalDocumentResponse:
    properties:
      active:
        type: boolean
      content:
        type: string
      title:
        type: string
      type:
        type: string
      uuid:
        type: string
      version:
        type: string
    type: object
  dto.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginUserResponse:
    properties:
      acces_token_expires_at:
        type: string
      access_token:
        type: string
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LogoutUserRequest:
    properties:
      session_id:
        type: string
    required:
    - session_id
    type: object
  dto.OAuthLoginRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  dto.RenewAccessTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RenewAccessTokenResponse:
    properties:
      acces_token_expires_at:
        type: string
      access_token:
        type: string
    type: object
  dto.TutorialResponse:
    properties:
      category:
        type: string
      content:
        type: string
      description:
        type: string
      image_url:
        type: string
      order_number:
        type: integer
      published:
        type: boolean
      title:
        type: string
      uuid:
        type: string
      video_url:
        type: string
    type: object
  dto.UpdateNameDeviceRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.UpdateUserNameRequest:
    properties:
      full_name:
        type: string
    required:
    - full_name
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      password_changed_at:
        type: string
      user_image:
        type: string
      username:
        type: string
    type: object
host: api-dev.ground-guard.com.br
info:
  contact:
    email: contato@groundguard.com
    name: Guilherme Teixeira
  description: |-
    API REST do Ground Guard, uma plataforma IoT para monitoramento e automação de jardins e plantas.
    Permite gerenciamento de dispositivos, preferências de irrigação, monitoramento ambiental e acionamento remoto de irrigação.
    Desenvolvido como TCC e preparado para evolução comercial.
  license:
    name: MIT
  termsOfService: https://groundguard.com/terms
  title: Ground Guard API
  version: 1.0.0
paths:
  /devices:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de todos os dispositivos associados
        ao usuário autenticado.
      parameters:
      - description: Número da página (mínimo 1)
        in: query
        name: page_id
        required: true
        type: integer
      - description: Quantidade de itens por página (5 a 10)
        in: query
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DeviceResponse'
            type: array
        "400":
          description: Bad Request (Parâmetros de paginação inválidos)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar dispositivos do usuário
      tags:
      - devices
    post:
      consumes:
      - application/json
      description: Registra um novo dispositivo no sistema e gera seu QR Code de pareamento.
      parameters:
      - description: Dados do dispositivo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden (Unique Violation)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cadastrar novo dispositivo
      tags:
      - devices
  /devices/{device_id}/irrigation-preferences:
    get:
      consumes:
      - application/json
      description: Retrieves all irrigation preferences associated with a specific
        device using the device's UUID.
      parameters:
      - description: Device UUID
        format: uuid
        in: path
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.IrrigationPreferenceResponse'
            type: array
        "400":
          description: Bad Request - Invalid Device UUID format
          schema:
            type: object
        "404":
          description: Not Found - Device or preferences not found
          schema:
            type: object
        "500":
          description: Internal Server Error - Database or server issues
          schema:
            type: object
      summary: Get irrigation preferences by Device UUID
      tags:
      - Irrigation Preferences
  /devices/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna as informações de um dispositivo específico cadastrado
        pelo UUID, garantindo que pertença ao usuário autenticado.
      parameters:
      - description: UUID do Dispositivo
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (UUID inválido)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Não pertence ao usuário)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obter detalhes de um dispositivo
      tags:
      - devices
  /devices/link/{qr_token}:
    put:
      consumes:
      - application/json
      description: Associa um dispositivo à conta do usuário autenticado lendo o QR
        Token passado na URL.
      parameters:
      - description: Token do QR Code do dispositivo
        in: path
        name: qr_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "401":
          description: Unauthorized (Usuário não autenticado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found (QR Token inválido)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Vincular dispositivo ao usuário
      tags:
      - devices
  /devices/name/{uuid}:
    put:
      consumes:
      - application/json
      description: Modifica o nome de um dispositivo cadastrado pelo UUID, garantindo
        que pertença ao usuário autenticado.
      parameters:
      - description: UUID do Dispositivo
        in: path
        name: uuid
        required: true
        type: string
      - description: Novo nome do dispositivo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateNameDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (UUID inválido)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Usuário não autenticado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found (Dispositivo não encontrado ou não pertence a você)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar nome do dispositivo
      tags:
      - devices
  /devices/register:
    post:
      consumes:
      - application/json
      description: Verifica a existência do dispositivo pelo UID. Se não existir,
        realiza o cadastro de um novo dispositivo. Se já existir, atualiza suas informações
        de rede e sistema (Firmware, IP, Wi-Fi, Status).
      parameters:
      - description: Dados do dispositivo para registro ou atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (JSON inválido)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden (Unique Violation)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registrar ou atualizar dispositivo
      tags:
      - devices
  /devices/uid/{uid}:
    get:
      consumes:
      - application/json
      description: Retorna as informações de um dispositivo específico cadastrado
        utilizando o seu UID (Unique Identifier).
      parameters:
      - description: UID do Dispositivo
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (UID inválido)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found (Dispositivo não encontrado)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obter detalhes de um dispositivo pelo UID
      tags:
      - devices
  /devices/unlink/{uuid}:
    put:
      consumes:
      - application/json
      description: Remove a associação de um dispositivo com a conta do usuário autenticado.
      parameters:
      - description: UUID do Dispositivo
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "400":
          description: Bad Request (UUID inválido)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized (Usuário não autenticado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found (Dispositivo não encontrado ou não pertence a você)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Desvincular dispositivo do usuário
      tags:
      - devices
  /faqs:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de FAQs
      parameters:
      - description: Número da página
        in: query
        minimum: 1
        name: page_id
        required: true
        type: integer
      - description: Tamanho da página
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            items:
              $ref: '#/definitions/dto.FaqResponse'
            type: array
        "400":
          description: Requisição inválida (Erro de paginação)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Listar FAQs
      tags:
      - faqs
  /faqs/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna os detalhes de um FAQ específico baseado no seu UUID
      parameters:
      - description: UUID do FAQ
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            $ref: '#/definitions/dto.FaqResponse'
        "400":
          description: Requisição inválida (Erro de bind ou UUID mal formatado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: FAQ não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Obter um FAQ
      tags:
      - faqs
  /helper:
    get:
      consumes:
      - application/json
      description: Endpoint simples para confirmar que a API está respondendo.
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            additionalProperties: true
            type: object
      summary: Verificar disponibilidade da API
      tags:
      - helper
  /help-contents:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de conteúdos de ajuda
      parameters:
      - description: Número da página
        in: query
        minimum: 1
        name: page_id
        required: true
        type: integer
      - description: Tamanho da página
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            items:
              $ref: '#/definitions/dto.HelpContentResponse'
            type: array
        "400":
          description: Requisição inválida (Erro de paginação)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Listar conteúdos de ajuda
      tags:
      - help-contents
  /help-contents/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna os detalhes de um conteúdo de ajuda específico baseado
        no seu UUID
      parameters:
      - description: UUID do conteúdo de ajuda
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            $ref: '#/definitions/dto.HelpContentResponse'
        "400":
          description: Requisição inválida (Erro de bind ou UUID mal formatado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Conteúdo de ajuda não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Obter um conteúdo de ajuda
      tags:
      - help-contents
  /irrigation-preferences:
    post:
      consumes:
      - application/json
      description: Creates a new irrigation preference configuration for a specific
        device based on its UUID.
      parameters:
      - description: Irrigation Preference Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateIrrigationPreferenceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.IrrigationPreferenceResponse'
        "400":
          description: Bad Request - Invalid input or UUID
          schema:
            type: object
        "404":
          description: Not Found - Device not found
          schema:
            type: object
        "500":
          description: Internal Server Error - Database or server issues
          schema:
            type: object
      summary: Create an irrigation preference
      tags:
      - Irrigation Preferences
  /irrigation-preferences/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves the details of a specific irrigation preference using
        its ID.
      parameters:
      - description: Irrigation Preference ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.IrrigationPreferenceResponse'
        "400":
          description: Bad Request - Invalid ID format
          schema:
            type: object
        "404":
          description: Not Found - Irrigation preference not found
          schema:
            type: object
        "500":
          description: Internal Server Error - Database or server issues
          schema:
            type: object
      summary: Get an irrigation preference by ID
      tags:
      - Irrigation Preferences
  /irrigation/command/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna os detalhes de um comando de irrigação específico através
        do seu UUID.
      parameters:
      - description: UUID do comando de irrigação
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateIrrigationCommandResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obter comando de irrigação
      tags:
      - irrigation
  /irrigation/commands:
    post:
      consumes:
      - application/json
      description: Registra um comando pendente para ser enviado ao ESP32 via MQTT.
      parameters:
      - description: Dados do comando
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateIrrigationCommandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateIrrigationCommandResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Criar comando de irrigação
      tags:
      - irrigation
  /legal-document/{uuid}:
    get:
      consumes:
      - application/json
      description: Retorna os detalhes de um documento legal específico baseado no
        seu UUID
      parameters:
      - description: UUID do documento legal
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sucesso
          schema:
            $ref: '#/definitions/dto.LegalDocumentResponse'
        "400":
          description: Requisição inválida (Erro de bind ou UUID mal formatado)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Documento legal não encontrado
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties: true
            type: object
      summary: Obter um documento legal
      tags:
      - legal-documents
  /legal-documents:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de documentos legais
      parameters:
