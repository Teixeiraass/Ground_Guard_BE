# Broker for development and the api-dev server.
#
# The API authenticates (user ground-guard-api in passwd) and is the only
# client allowed to publish commands or read every device's topics.
# Devices still connect without credentials, but acl.conf confines each one
# to the topics of its own client id (= its UID): no one can forge
# START/STOP/OTA/PAIRING commands or subscribe to everyone's telemetry.
#
# Remaining gap until devices get per-device passwords: a client that
# connects using another device's UID as client id can impersonate it.

allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

listener 1883

max_packet_size 65536
max_inflight_messages 20
