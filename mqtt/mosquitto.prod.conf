# Production broker: TLS for devices, authenticated API, per-device ACL.
#
# Same ACL as development (acl.conf). Adds TLS on 8883 for devices and keeps
# plain 1883 bound to localhost for the API. The firmware needs the broker CA
# before devices can move to 8883.

allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Public listener: TLS only.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Plain listener bound to localhost for the API on the same host/network.
listener 1883 127.0.0.1

max_packet_size 65536
max_inflight_messages 20
