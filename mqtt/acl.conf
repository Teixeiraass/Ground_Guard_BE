# Device rules (apply to every client, including anonymous devices).
# %c = MQTT client id, which the firmware sets to the device UID. A device
# may publish only its own telemetry/state/events and read only its own
# commands. Publishing to any .../commands topic and wildcard subscriptions
# are denied, because nothing below grants them.
pattern write ground-guard/devices/%c/telemetry
pattern write ground-guard/devices/%c/state
pattern write ground-guard/devices/%c/events
pattern read ground-guard/devices/%c/commands

# The API reads every device topic and is the only one allowed to send commands.
user ground-guard-api
topic readwrite ground-guard/#
